{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

    <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}" />
    <link rel="stylesheet" type="text/css" href="{% static 'css/index.css' %}" />
    <link rel="stylesheet" type="text/css" href="{% static 'css/navegacao.css' %}" />
    <link rel="stylesheet" type="text/css" href="{% static 'css/cadastro.css' %}" />
    <link rel="stylesheet" type="text/css" href="{% static 'css/exclusao.css' %}" />
    <link rel="stylesheet" type="text/css" href="{% static 'css/alterar.css' %}" />

    <title>
      {% block title %}
        Dashboard - Oficina Mecânica
      {% endblock %}
    </title>
  </head>
  <body>
    <div id="app">
      {% include 'navbar.html' %}
      <main class="main-container">
        {% comment %}Área de conteúdo dinâmico{% endcomment %}
        {% block content %}

        {% endblock %}
      </main>
    </div>
    
  </body>
</html>
